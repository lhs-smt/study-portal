<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxO5GiDkOOv2nu0Ic1ARDyzZVgi9fjGhvhyLWMvtKn9qCO1Kt8oEInzDdVva1RD9mUL/exec";

  const PRAISE_MESSAGES = ["Good job! 🌟", "You're so smart! 💡", "You're great at this! ✨", "Let's get them all! 🚀", "Wonderful! 🎈", "Amazing! 🎉", "That's right! 🙌"];
  const ENCOURAGEMENT_MESSAGES = ["You can get the next one! 💪", "That's okay! 🌱", "Don't worry! 😊", "You can get this next time! 🎯", "Mistakes make perfect! ✨"];

  const MOTIVATIONAL_QUOTES = [
    `"Success is the sum of small efforts, repeated day in and day out."`,
    `"Believe you can and you're halfway there."`,
    `"Don't watch the clock; do what it does. Keep going."`,
    `"The expert in anything was once a beginner."`,
    `"Strive for progress, not perfection."`
  ];

  let currentUser = "";
  let userRole = "";
  let userTitle = "";
  let userName = "";
  let commonName = "";
  let activeQuiz = null;
  let activeQuestions = [];
  let userAnswers = {};
  let lockedQuestions = {};
  let currentQuestionIndex = 0;

  // Resilient Fetch with Auto-Retry for GAS Cold Starts
  async function fetchWithRetry(url, options = {}, retries = 3, backoff = 1000) {
    for (let i = 0; i < retries; i++) {
      try {
        const res = await fetch(url, options);
        if (res.ok) return await res.json();
      } catch (err) {
        if (i === retries - 1) throw err;
        await new Promise(r => setTimeout(r, backoff * (i + 1))); // Wait 1s, then 2s
      }
    }
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function getSavedUnitProgress(quizId) {
    const data = localStorage.getItem(`unit_progress_${quizId}`);
    return data ? JSON.parse(data) : { answered: 0, total: 30, percent: 0 };
  }

  function saveUnitProgress(quizId, answeredCount, totalCount) {
    const percent = totalCount > 0 ? Math.round((answeredCount / totalCount) * 100) : 0;
    localStorage.setItem(`unit_progress_${quizId}`, JSON.stringify({ answered: answeredCount, total: totalCount, percent }));
  }

  async function handleLoginSubmit(e) {
    if (e) e.preventDefault();
    const email = document.getElementById("emailInput").value.trim().toLowerCase();
    const password = document.getElementById("passwordInput").value.trim();
    const loginBtn = document.getElementById("loginBtn");

    if (!email || !password) {
      alert("Please enter both your email and password.");
      return;
    }

    loginBtn.innerText = "Verifying credentials (connecting to Google)...";
    loginBtn.disabled = true;

    try {
      const data = await fetchWithRetry(`${GAS_API_URL}?action=checkUserRole&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`);

      if (!data || !data.authenticated) {
        alert(data?.error || "Authentication failed. Please check your credentials.");
        loginBtn.innerText = "Authenticate & Enter Portal →";
        loginBtn.disabled = false;
        return;
      }

      currentUser = email;
      userRole = data.role;     
      userTitle = data.title;   
      userName = data.name || "";     

      if (data.commonName) {
        commonName = data.commonName;
      } else if (data.name) {
        const nameParts = data.name.trim().split(" ");
        commonName = nameParts.length > 1 ? nameParts[1] : nameParts[0];
      } else {
        commonName = "Student";
      }

      // SAVE SESSION TO LOCALSTORAGE FOR PERMANENT PERSISTENCE ACROSS CLOSING TAB/BROWSER
      localStorage.setItem("lhs_user_session", JSON.stringify({
        email: currentUser,
        role: userRole,
        title: userTitle,
        name: userName,
        commonName: commonName
      }));

      initPortalSession();

    } catch (err) {
      alert("Google Apps Script is taking too long to respond. Please click login again.");
      loginBtn.innerText = "Authenticate & Enter Portal →";
      loginBtn.disabled = false;
    }
  }

  function initPortalSession() {
    document.getElementById("loginModal").classList.add("hidden");
    updateUserUI();

    if (userRole === "teacher") {
      document.getElementById("teacherBanner").classList.remove("hidden");
      document.getElementById("teacherTableContainer").classList.remove("hidden");
      document.getElementById("studentStatsGrid").classList.add("hidden");
      loadTeacherData();
    } else {
      document.getElementById("teacherBanner").classList.add("hidden");
      document.getElementById("teacherTableContainer").classList.add("hidden");
      document.getElementById("studentStatsGrid").classList.remove("hidden");
      loadStudentStats();
    }

    loadQuizIndex();
  }

  function updateUserUI() {
    const tag = document.getElementById("userProfileTag");
    tag.innerHTML = `
      <div class="text-right">
        <div class="text-xs font-bold text-white">${userName || currentUser}</div>
        <div class="text-[10px] font-semibold uppercase ${userRole === 'teacher' ? 'text-amber-400' : 'text-emerald-400'}">${userTitle || userRole}</div>
      </div>
      <button onclick="logoutUser()" class="ml-2 px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] rounded-lg border border-slate-700 cursor-pointer">Logout</button>
    `;

    document.getElementById("welcomeTitle").innerText = `Welcome ${commonName}!`;
    const randomQuote = MOTIVATIONAL_QUOTES[Math.floor(Math.random() * MOTIVATIONAL_QUOTES.length)];
    document.getElementById("motivationalQuote").innerText = randomQuote;
  }

  function logoutUser() {
    localStorage.removeItem("lhs_user_session");
    sessionStorage.removeItem("lhs_user_session");
    location.reload();
  }

  async function loadStudentStats() {
    try {
      const data = await fetchWithRetry(`${GAS_API_URL}?action=getLeaderboard`);
      const stat = data.find(s => s.email.toLowerCase() === currentUser);

      if (stat) {
        document.getElementById("statAvgScore").innerText = stat.bestScore + "%";
        document.getElementById("statFirstTry").innerText = stat.firstTry100s;
        document.getElementById("statAttempts").innerText = stat.attemptsCount;
      }
    } catch (e) { console.error(e); }
  }

  async function loadTeacherData() {
    try {
      const data = await fetchWithRetry(`${GAS_API_URL}?action=getLeaderboard`);
      const tbody = document.getElementById("teacherTableBody");
      tbody.innerHTML = "";

      if (!data || data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='4' class='p-3 text-slate-500'>No student records recorded yet.</td></tr>";
        return;
      }

      data.forEach(r => {
        tbody.innerHTML += `
          <tr class="border-b border-slate-800/60">
            <td class="p-3 font-semibold text-slate-200">${r.email}</td>
            <td class="p-3 text-slate-300">${r.attemptsCount}</td>
            <td class="p-3 text-amber-300">🏅 ${r.firstTry100s}</td>
            <td class="p-3 font-bold text-emerald-400">${r.bestScore}%</td>
          </tr>
        `;
      });
    } catch (e) { console.error(e); }
  }

  // REFRESH UNITS FUNCTION
  async function refreshUnits() {
    const grid = document.getElementById("quizCardsGrid");
    grid.innerHTML = "<div class='text-xs text-slate-400 p-4'>Refreshing units list...</div>";
    await loadQuizIndex();
  }

  async function loadQuizIndex() {
    const grid = document.getElementById("quizCardsGrid");
    try {
      const list = await fetchWithRetry(`${GAS_API_URL}?action=getQuizIndex`);
      grid.innerHTML = "";

      if (!list || list.length === 0) {
        grid.innerHTML = "<div class='text-xs text-slate-500'>No published quizzes found in Quiz_Index.</div>";
        return;
      }

      list.forEach(q => {
        const prog = getSavedUnitProgress(q.quizId);
        grid.innerHTML += `
          <div class="bg-slate-900 rounded-2xl border border-slate-800 p-5 card-shadow flex flex-col justify-between">
            <div>
              <span class="px-2.5 py-0.5 rounded-md text-[11px] font-bold bg-slate-800 text-emerald-400 border border-slate-700/50">${q.subject}</span>
              <h3 class="font-bold text-white text-base mt-2">${q.unit}</h3>
              <p class="text-xs text-slate-400 mb-3">${q.title}</p>
              
              <div class="mb-4">
                <div class="flex justify-between items-center text-[11px] font-semibold text-slate-400 mb-1">
                  <span>Progress</span>
                  <span class="text-emerald-400">${prog.percent}%</span>
                </div>
                <div class="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
                  <div class="h-full bg-emerald-500 transition-all duration-300" style="width: ${prog.percent}%"></div>
                </div>
              </div>
            </div>

            <button onclick="startQuiz('${q.sheetId}', '${q.subject}', '${q.title}', '${q.quizId}')" class="w-full py-2 px-3 rounded-xl text-xs font-bold bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition-all cursor-pointer">
              ${prog.answered > 0 ? 'Continue Unit Quiz &rarr;' : 'Start Unit Quiz &rarr;'}
            </button>
          </div>
        `;
      });
    } catch (e) {
      grid.innerHTML = "<div class='text-xs text-rose-400 flex items-center gap-2'>Error loading quiz index. <button onclick='refreshUnits()' class='underline font-bold text-white cursor-pointer'>Tap here to try again</button></div>";
    }
  }

  async function startQuiz(sheetId, subject, title, quizId) {
    activeQuiz = { sheetId, subject, title, quizId };
    userAnswers = {};
    lockedQuestions = {};
    currentQuestionIndex = 0;

    document.getElementById("quizSubjectTag").innerText = subject;
    document.getElementById("quizModalTitle").innerText = title;
    document.getElementById("quizQuestionBody").innerHTML = "<div class='text-xs text-slate-500 p-4 text-center'>Loading questions from Google Sheets...</div>";
    document.getElementById("quizModal").classList.remove("hidden");

    try {
      const fetchedQuestions = await fetchWithRetry(`${GAS_API_URL}?action=getQuiz&sheetId=${sheetId}`);
      
      if (Array.isArray(fetchedQuestions)) {
        const shuffled = shuffleArray(fetchedQuestions).map(q => {
          if (q.options && Array.isArray(q.options)) {
            q.options = shuffleArray([...q.options]);
          }
          return q;
        });
        activeQuestions = shuffled.slice(0, 30);
      } else {
        activeQuestions = [];
      }

      renderQuizQuestions();
    } catch (e) {
      document.getElementById("quizQuestionBody").innerHTML = "<div class='text-xs text-rose-400 p-4 text-center'>Failed to load questions. Close and click Start Quiz again.</div>";
    }
  }

  function renderQuizQuestions() {
    const container = document.getElementById("quizQuestionBody");
    container.innerHTML = "";

    if (!activeQuestions || activeQuestions.length === 0) return;

    const idx = currentQuestionIndex;
    const q = activeQuestions[idx];

    let correctAnswersCount = 0;
    Object.keys(lockedQuestions).forEach(qKey => {
      if (userAnswers[qKey]?.selected === activeQuestions[qKey].correctOption) {
        correctAnswersCount++;
      }
    });
    const progressPercent = Math.round((correctAnswersCount / activeQuestions.length) * 100);

    const qCard = document.createElement("div");
    qCard.className = "p-4 border border-slate-800 rounded-xl space-y-2 bg-slate-950 relative";
    
    const qHeader = document.createElement("div");
    qHeader.className = "flex flex-col gap-2 mb-2";
    qHeader.innerHTML = `
      <div class="flex justify-between items-center text-[11px] font-bold">
        <span class="text-emerald-400">Question ${idx + 1} of ${activeQuestions.length}</span>
        <span class="text-slate-400">Score Progress: ${correctAnswersCount}/${activeQuestions.length} (${progressPercent}%)</span>
      </div>
      <div class="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
        <div class="h-full bg-emerald-500 transition-all duration-300" style="width: ${progressPercent}%"></div>
      </div>
    `;
    qCard.appendChild(qHeader);

    const qTitle = document.createElement("h4");
    qTitle.className = "text-sm font-bold text-white";
    qTitle.innerText = `Q${idx + 1}. ${q.question}`;
    qCard.appendChild(qTitle);

    if (q.imageUrl) {
      qCard.innerHTML += `<img src="${q.imageUrl}" class="max-w-full rounded-lg my-2 border border-slate-800" />`;
    }

    const optsContainer = document.createElement("div");
    optsContainer.className = "space-y-1.5 mt-2";

    q.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "w-full text-left p-3 rounded-xl border text-xs font-medium transition-all bg-slate-900 border-slate-800 text-slate-200 hover:border-emerald-500 hover:text-white cursor-pointer";
      btn.innerText = `${opt.id}. ${opt.text}`;

      if (lockedQuestions[idx]) {
        btn.disabled = true;
        btn.classList.remove("cursor-pointer");
        if (opt.id === q.correctOption) {
          btn.className = "w-full text-left p-3 rounded-xl border text-xs font-bold bg-emerald-950/80 border-emerald-500 text-emerald-300";
        }
        if (userAnswers[idx]?.selected === opt.id && opt.id !== q.correctOption) {
          btn.className = "w-full text-left p-3 rounded-xl border text-xs font-bold bg-rose-950/80 border-rose-500 text-rose-300";
        }
      } else {
        btn.onclick = () => chooseAnswer(idx, opt.id, q.correctOption);
      }

      optsContainer.appendChild(btn);
    });

    qCard.appendChild(optsContainer);

    if (lockedQuestions[idx]) {
      const feedback = document.createElement("div");
      feedback.className = "absolute left-1/2 bottom-12 z-20 pointer-events-none transform -translate-x-1/2 px-4 py-2 bg-emerald-950/95 border border-emerald-500 text-emerald-200 text-xs font-extrabold rounded-full shadow-2xl backdrop-blur-md animate-fly-popup flex items-center gap-1.5 whitespace-nowrap";
      feedback.innerText = userAnswers[idx].feedbackMsg;
      qCard.appendChild(feedback);

      if (q.explanation) {
        const exp = document.createElement("div");
        exp.className = "p-2.5 bg-slate-900 text-slate-300 text-xs rounded-lg border border-slate-800 mt-2 animate-float-in";
        exp.innerHTML = `<strong class="text-emerald-400">Explanation:</strong> ${q.explanation}`;
        qCard.appendChild(exp);
      }
    }

    container.appendChild(qCard);

    const nextBtn = document.getElementById("nextBtn");
    const submitBtn = document.getElementById("submitBtn");
    const isAnswered = !!lockedQuestions[idx];

    if (idx === activeQuestions.length - 1) {
      nextBtn.classList.add("hidden");
      submitBtn.classList.remove("hidden");
      submitBtn.disabled = !isAnswered;
      if (isAnswered) {
        submitBtn.className = "px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs rounded-xl shadow-md transition-all cursor-pointer";
      } else {
        submitBtn.className = "px-4 py-2 bg-slate-800 text-slate-500 font-extrabold text-xs rounded-xl transition-all opacity-50 cursor-not-allowed";
      }
    } else {
      nextBtn.classList.remove("hidden");
      submitBtn.classList.add("hidden");
      nextBtn.disabled = !isAnswered;
      if (isAnswered) {
        nextBtn.className = "px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs rounded-xl shadow-md transition-all cursor-pointer";
      } else {
        nextBtn.className = "px-4 py-2 bg-slate-800 text-slate-500 font-extrabold text-xs rounded-xl transition-all opacity-50 cursor-not-allowed";
      }
    }
  }

  function nextQuestion() {
    if (currentQuestionIndex < activeQuestions.length - 1 && lockedQuestions[currentQuestionIndex]) {
      currentQuestionIndex++;
      renderQuizQuestions();
    }
  }

  function chooseAnswer(qIdx, selectedOptId, correctOptId) {
    if (lockedQuestions[qIdx]) return;

    const isCorrect = selectedOptId === correctOptId;
    const msgList = isCorrect ? PRAISE_MESSAGES : ENCOURAGEMENT_MESSAGES;
    const feedbackMsg = msgList[Math.floor(Math.random() * msgList.length)];

    userAnswers[qIdx] = { selected: selectedOptId, feedbackMsg };
    lockedQuestions[qIdx] = true;

    const answeredCount = Object.keys(lockedQuestions).length;
    saveUnitProgress(activeQuiz.quizId, answeredCount, activeQuestions.length);

    renderQuizQuestions();
    loadQuizIndex();
  }

  async function submitQuiz() {
    if (!lockedQuestions[currentQuestionIndex]) return;

    let scoreCount = 0;
    activeQuestions.forEach((q, idx) => {
      if (userAnswers[idx]?.selected === q.correctOption) scoreCount++;
    });

    const percent = Math.round((scoreCount / activeQuestions.length) * 100);

    alert(`Quiz Submitted!\nScore: ${percent}% (${scoreCount}/${activeQuestions.length} correct)`);

    try {
      await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "submitResult",
          email: currentUser,
          quizId: activeQuiz.quizId,
          score: percent,
          attemptNumber: 1,
          isFirstTry100: percent === 100
        })
      });
    } catch (e) {
      console.error("Score logging delayed, background network retry active.");
    }

    closeQuizModal();
    if (userRole === "teacher") {
      loadTeacherData();
    } else {
      loadStudentStats();
    }
  }

  function closeQuizModal() {
    document.getElementById("quizModal").classList.add("hidden");
  }

  // AUTO-RESTORE SESSION ON PAGE RELOAD / RE-ENTRY (LocalStorage first, SessionStorage fallback)
  window.onload = () => {
    const savedSession = localStorage.getItem("lhs_user_session") || sessionStorage.getItem("lhs_user_session");
    if (savedSession) {
      try {
        const user = JSON.parse(savedSession);
        currentUser = user.email;
        userRole = user.role;
        userTitle = user.title;
        userName = user.name;
        commonName = user.commonName;
        initPortalSession();
        return;
      } catch (e) {
        localStorage.removeItem("lhs_user_session");
        sessionStorage.removeItem("lhs_user_session");
      }
    }
    
    document.getElementById("loginModal").classList.remove("hidden");
  };
</script>
