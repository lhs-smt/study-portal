<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L. Hithadhoo School - Studyspace</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f293d;
      --primary-green: #10b981;
      --primary-green-hover: #059669;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--primary-green);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-details {
      text-align: right;
    }

    .user-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .user-role {
      font-size: 0.75rem;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-logout {
      background: #1f2937;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: #374151;
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Auth Section */
    .auth-container {
      max-width: 400px;
      margin: 4rem auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 2rem;
    }

    .auth-title {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      background: #1f2937;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .btn-primary {
      width: 100%;
      padding: 0.75rem;
      background: var(--primary-green);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--primary-green-hover);
    }

    /* Dashboard Section */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .section-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .btn-refresh {
      background: #1f2937;
      color: var(--accent-blue);
      border: 1px solid var(--card-border);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* Quiz Grid */
    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .quiz-card:hover {
      border-color: #374151;
      transform: translateY(-2px);
    }

    .unit-badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      width: fit-content;
    }

    .quiz-card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    .quiz-subject {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .btn-start-quiz {
      width: 100%;
      padding: 0.75rem;
      background: var(--primary-green);
      color: #052e16;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-start-quiz:hover {
      background: var(--primary-green-hover);
      color: #fff;
    }

    /* Modal / Quiz Viewer */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      width: 90%;
      max-width: 650px;
      padding: 2rem;
      max-height: 90vh;
      overflow-y: auto;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 0.85rem 1rem;
      margin-bottom: 0.75rem;
      background: #1f2937;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background: #374151;
    }

    .hidden {
      display: none !important;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand-title">L. Hithadhoo School</div>
      <div class="brand-subtitle">Studyspace</div>
    </div>
    <div id="user-header-info" class="user-info hidden">
      <div class="user-details">
        <div id="header-user-name" class="user-name">User Name</div>
        <div id="header-user-role" class="user-role">Role</div>
      </div>
      <button onclick="logout()" class="btn-logout">Logout</button>
    </div>
  </header>

  <main>
    <!-- LOGIN VIEW -->
    <div id="login-view" class="auth-container">
      <h2 class="auth-title">Sign In</h2>
      <div class="form-group">
        <label>School Email</label>
        <input type="email" id="login-email" placeholder="student@lhithadhooschool.edu.mv">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button onclick="handleLogin()" class="btn-primary">Sign In</button>
    </div>

    <!-- MAIN DASHBOARD VIEW -->
    <div id="dashboard-view" class="hidden">
      <div class="section-header">
        <div>
          <h2 class="section-title">Let's Practice!</h2>
          <p class="section-subtitle">Select any syllabus unit to take an interactive quiz</p>
        </div>
        <button onclick="loadQuizzes()" class="btn-refresh">🔄 Refresh Quizzes</button>
      </div>

      <div id="quiz-container" class="quiz-grid">
        <!-- Quiz cards rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- QUIZ RUNNER MODAL -->
  <div id="quiz-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 id="modal-quiz-title" style="margin-bottom: 1rem;">Quiz Title</h3>
      <div id="modal-question-container">
        <p id="modal-question-text" style="font-size: 1.1rem; margin-bottom: 1.5rem;"></p>
        <div id="modal-options-container"></div>
      </div>
      <button onclick="closeQuizModal()" class="btn-logout" style="margin-top: 1.5rem; width: 100%;">Close Quiz</button>
    </div>
  </div>

  <footer>
    L. Hithadhoo School - Studyspace &copy; 2026
  </footer>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxO5GiDkOOv2nu0Ic1ARDyzZVgi9fjGhvhyLWMvtKn9qCO1Kt8oEInzDdVva1RD9mUL/exec";

    let currentUser = null;
    let currentQuestions = [];
    let currentQuestionIndex = 0;

    // Check existing session
    window.addEventListener("DOMContentLoaded", () => {
      const savedUser = localStorage.getItem("studyspace_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showDashboard();
      }
    });

    function handleLogin() {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value.trim();

      if (!email || !password) {
        alert("Please enter both email and password.");
        return;
      }

      fetch(`${GAS_API_URL}?action=checkUserRole&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`)
        .then(res => res.json())
        .then(data => {
          if (data.authenticated) {
            currentUser = {
              email: email,
              name: data.name,
              role: data.role,
              title: data.title
            };
            localStorage.setItem("studyspace_user", JSON.stringify(currentUser));
            showDashboard();
          } else {
            alert(data.error || "Invalid login credentials.");
          }
        })
        .catch(err => {
          console.error("Login error:", err);
          alert("Unable to connect to service. Please try again.");
        });
    }

    function logout() {
      localStorage.removeItem("studyspace_user");
      currentUser = null;
      document.getElementById("dashboard-view").classList.add("hidden");
      document.getElementById("user-header-info").classList.add("hidden");
      document.getElementById("login-view").classList.remove("hidden");
    }

    function showDashboard() {
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("dashboard-view").classList.remove("hidden");
      document.getElementById("user-header-info").classList.remove("hidden");

      document.getElementById("header-user-name").textContent = currentUser.name;
      document.getElementById("header-user-role").textContent = currentUser.title;

      loadQuizzes();
    }

    function loadQuizzes() {
      const container = document.getElementById("quiz-container");
      container.innerHTML = `<p style="color: var(--text-muted);">Loading available unit quizzes...</p>`;

      fetch(`${GAS_API_URL}?action=getQuizIndex`)
        .then(res => res.json())
        .then(data => {
          renderQuizzes(data);
        })
        .catch(err => {
          console.error("Error fetching quiz index:", err);
          container.innerHTML = `<p style="color: #ef4444;">Failed to load quizzes. Please check your connection.</p>`;
        });
    }

    function renderQuizzes(quizList) {
      const container = document.getElementById("quiz-container");
      container.innerHTML = "";

      if (!quizList || quizList.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted);">No quizzes found in index.</p>`;
        return;
      }

      quizList.forEach(q => {
        // Explicitly extract parameters based on backend mapping
        const quizId = q.quizId;
        const subject = q.subject;
        const sheetId = q.sheetId; // Correct Google Sheet ID for questions lookup
        const unit = q.unit;       // e.g. "Unit 1"
        const title = q.title;     // Human-readable title

        const card = document.createElement("div");
        card.className = "quiz-card";

        card.innerHTML = `
          <div>
            <div class="unit-badge">${unit}</div>
            <div class="quiz-card-title">${title}</div>
            <div class="quiz-subject">${subject} (${quizId})</div>
          </div>
          <div>
            <div class="progress-info">
              <span>Progress</span>
              <span>0%</span>
            </div>
            <button class="btn-start-quiz" onclick="startQuiz('${sheetId}', '${title}')">
              Start Unit Quiz →
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function startQuiz(sheetId, title) {
      document.getElementById("modal-quiz-title").textContent = title;
      document.getElementById("modal-question-text").textContent = "Loading questions...";
      document.getElementById("modal-options-container").innerHTML = "";
      document.getElementById("quiz-modal").classList.remove("hidden");

      fetch(`${GAS_API_URL}?action=getQuiz&sheetId=${encodeURIComponent(sheetId)}`)
        .then(res => res.json())
        .then(questions => {
          if (!questions || questions.length === 0) {
            document.getElementById("modal-question-text").textContent = "No questions found for this quiz unit.";
            return;
          }
          currentQuestions = questions;
          currentQuestionIndex = 0;
          displayQuestion();
        })
        .catch(err => {
          console.error("Error loading quiz questions:", err);
          document.getElementById("modal-question-text").textContent = "Failed to load questions. Please verify sheet permissions.";
        });
    }

    function displayQuestion() {
      const q = currentQuestions[currentQuestionIndex];
      document.getElementById("modal-question-text").textContent = `${currentQuestionIndex + 1}. ${q.question}`;
      
      const optionsContainer = document.getElementById("modal-options-container");
      optionsContainer.innerHTML = "";

      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = `${opt.id}) ${opt.text}`;
        btn.onclick = () => selectOption(opt.id, q.correctOption);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selected, correct) {
      if (selected === correct) {
        alert("Correct!");
      } else {
        alert(`Incorrect. The correct answer was ${correct}.`);
      }

      if (currentQuestionIndex < currentQuestions.length - 1) {
        currentQuestionIndex++;
        displayQuestion();
      } else {
        alert("Quiz completed!");
        closeQuizModal();
      }
    }

    function closeQuizModal() {
      document.getElementById("quiz-modal").classList.add("hidden");
    }
  </script>
</body>
</html>
