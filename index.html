<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L. Hithadhoo School - Studyspace</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 1.25rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.9rem;
    }

    .btn-logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* Auth Modal / Container */
    .auth-container {
      max-width: 400px;
      margin: 4rem auto;
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .auth-subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      color: #cbd5e1;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: white;
      font-size: 0.95rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .btn-primary {
      width: 100%;
      padding: 0.75rem;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #0369a1;
    }

    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      text-align: center;
    }

    /* Dashboard Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 2rem;
    }

    @media (max-width: 900px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Quiz Cards */
    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .quiz-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .quiz-card:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
    }

    .quiz-subject {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .quiz-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .quiz-unit {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1rem;
    }

    .quiz-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-secondary {
      flex: 1;
      padding: 0.5rem;
      background: #334155;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    /* Leaderboard */
    .leaderboard-list {
      list-style: none;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #334155;
    }

    .leaderboard-item:last-child {
      border-bottom: none;
    }

    .rank {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      margin-right: 0.75rem;
    }

    .rank-1 { background: #eab308; color: #0f172a; }
    .rank-2 { background: #94a3b8; color: #0f172a; }
    .rank-3 { background: #b45309; color: white; }

    .user-details {
      flex: 1;
    }

    .user-name {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .user-stats {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .score-badge {
      font-weight: 700;
      font-size: 0.9rem;
      color: #4ade80;
    }

    /* Quiz Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header id="header" class="hidden">
    <div class="logo">
      <span>📚 L. Hithadhoo School Studyspace</span>
    </div>
    <div class="user-info">
      <span id="nav-user-name">Student</span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <!-- Auth Section -->
    <div id="auth-section" class="auth-container">
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to access your study portal</p>
      
      <div class="form-group">
        <label for="email">School Email</label>
        <input type="email" id="email" placeholder="student@hithadhoo.edu.mv">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <button class="btn-primary" onclick="login()">Sign In</button>
      <div id="auth-error" class="error-msg"></div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard-section" class="dashboard-grid hidden">
      <div>
        <div class="card">
          <div class="card-title">
            <span>Available Quizzes</span>
          </div>
          <div id="quiz-list" class="quiz-grid">
            <p style="color: #94a3b8;">Loading quizzes...</p>
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="card-title">
            <span>🏆 Leaderboard</span>
          </div>
          <ul id="leaderboard-list" class="leaderboard-list">
            <li style="color: #94a3b8;">Loading rankings...</li>
          </ul>
        </div>
      </div>
    </div>
  </main>

  <!-- Quiz Modal -->
  <div id="quiz-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <button class="close-btn" onclick="closeQuizModal()">&times;</button>
      <div id="quiz-container">
        <!-- Dynamic Quiz Content -->
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcQfS45k_R4k-KqS-o6G78qS5hC7k7M1A2B3C/exec"; // Update with your Apps Script Deployment URL if needed

    let currentUser = null;
    let currentQuizQuestions = [];
    let currentQuizId = "";

    // Load session on startup
    window.addEventListener("DOMContentLoaded", () => {
      const savedUser = localStorage.getItem("studyspace_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showDashboard();
      }
    });

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorDiv = document.getElementById("auth-error");

      errorDiv.innerText = "";

      if (!email || !password) {
        errorDiv.innerText = "Please enter both email and password.";
        return;
      }

      try {
        const response = await fetch(`${SCRIPT_URL}?action=checkUserRole&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`);
        const data = await response.json();

        if (data.authenticated) {
          currentUser = {
            email: email,
            name: data.name || email.split("@")[0],
            commonName: data.commonName || data.name,
            role: data.role
          };
          localStorage.setItem("studyspace_user", JSON.stringify(currentUser));
          showDashboard();
        } else {
          errorDiv.innerText = data.error || "Invalid credentials.";
        }
      } catch (err) {
        errorDiv.innerText = "Network or server error during login.";
      }
    }

    function logout() {
      localStorage.removeItem("studyspace_user");
      currentUser = null;
      document.getElementById("header").classList.add("hidden");
      document.getElementById("dashboard-section").classList.add("hidden");
      document.getElementById("auth-section").classList.remove("hidden");
    }

    function showDashboard() {
      document.getElementById("auth-section").classList.add("hidden");
      document.getElementById("header").classList.remove("hidden");
      document.getElementById("dashboard-section").classList.remove("hidden");
      document.getElementById("nav-user-name").innerText = currentUser.commonName || currentUser.name;

      loadQuizIndex();
      loadLeaderboard();
    }

    async function loadQuizIndex() {
      const container = document.getElementById("quiz-list");
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getQuizIndex`);
        const quizzes = await response.json();

        if (!quizzes || quizzes.length === 0) {
          container.innerHTML = `<p style="color: #94a3b8;">No quizzes available right now.</p>`;
          return;
        }

        container.innerHTML = quizzes.map(q => `
          <div class="quiz-card">
            <div>
              <span class="quiz-subject">${q.subject}</span>
              <div class="quiz-title">${q.title}</div>
              <div class="quiz-unit">${q.unit}</div>
            </div>
            <div class="quiz-actions">
              <button class="btn-primary" onclick="startQuiz('${q.sheetId}', '${q.quizId}')">Start</button>
              ${q.notesUrl ? `<a href="${q.notesUrl}" target="_blank" class="btn-secondary">Notes</a>` : ''}
            </div>
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = `<p style="color: #f87171;">Failed to load quizzes.</p>`;
      }
    }

    async function loadLeaderboard() {
      const container = document.getElementById("leaderboard-list");
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getLeaderboard`);
        const leaderboard = await response.json();

        if (!leaderboard || leaderboard.length === 0) {
          container.innerHTML = `<li style="color: #94a3b8;">No leaderboard data available yet.</li>`;
          return;
        }

        // Sort by best score descending
        leaderboard.sort((a, b) => b.bestScore - a.bestScore);

        container.innerHTML = leaderboard.map((item, index) => {
          const rankClass = index < 3 ? `rank-${index + 1}` : '';
          const name = item.commonName || item.name || item.email.split('@')[0];
          return `
            <li class="leaderboard-item">
              <div style="display: flex; align-items: center;">
                <span class="rank ${rankClass}">${index + 1}</span>
                <div class="user-details">
                  <div class="user-name">${name}</div>
                  <div class="user-stats">${item.attemptsCount} attempts ${item.firstTry100s ? `• 🌟 ${item.firstTry100s}` : ''}</div>
                </div>
              </div>
              <span class="score-badge">${item.bestScore}%</span>
            </li>
          `;
        }).join('');

      } catch (err) {
        container.innerHTML = `<li style="color: #f87171;">Failed to load leaderboard.</li>`;
      }
    }

    async function startQuiz(sheetId, quizId) {
      currentQuizId = quizId;
      const modal = document.getElementById("quiz-modal");
      const container = document.getElementById("quiz-container");

      modal.classList.remove("hidden");
      container.innerHTML = `<p style="text-align: center; color: #94a3b8; padding: 2rem;">Loading question content...</p>`;

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getQuiz&sheetId=${encodeURIComponent(sheetId)}`);
        currentQuizQuestions = await response.json();

        if (!currentQuizQuestions || currentQuizQuestions.length === 0) {
          container.innerHTML = `<p style="color: #f87171; text-align: center;">No questions found in this quiz sheet.</p>`;
          return;
        }

        // Render first question
        renderWrittenQuestion(currentQuizQuestions[0], 0, currentQuizQuestions.length);

      } catch (err) {
        container.innerHTML = `<p style="color: #f87171; text-align: center;">Failed to load question details.</p>`;
      }
    }

    function closeQuizModal() {
      document.getElementById("quiz-modal").classList.add("hidden");
    }

    // Render Written Question & Context
    function renderWrittenQuestion(q, currentIndex, totalQuestions) {
      const container = document.getElementById("quiz-container");
      
      const caseStudyHtml = q.caseStudy ? `
        <div style="background: rgba(255,255,255,0.05); border-left: 4px solid #3b82f6; padding: 12px; margin-bottom: 16px; border-radius: 4px; font-size: 0.9em; line-height: 1.5; color: #e2e8f0;">
          <strong style="color: #60a5fa; display: block; margin-bottom: 4px;">📖 Case Study / Context:</strong>
          ${q.caseStudy.replace(/\n/g, '<br>')}
        </div>
      ` : '';

      container.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85em; color: #94a3b8;">
          <span>Question ${currentIndex + 1} of ${totalQuestions}</span>
          <span>Earned Marks: 0/${q.maxMarks || 6} (0%)</span>
        </div>

        ${caseStudyHtml}

        <div style="font-weight: 600; font-size: 1.05em; margin-bottom: 12px; color: #f8fafc;">
          ${q.question}
        </div>

        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 0.85em; margin-bottom: 6px; color: #cbd5e1;">Your Written Answer:</label>
          <textarea id="student-written-answer" rows="6" style="width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 10px; font-family: inherit; font-size: 0.9em; resize: vertical;" placeholder="Type your response here..."></textarea>
        </div>

        <button id="submit-written-btn" onclick="submitWrittenAnswer(${currentIndex})" style="width: 100%; background: #2563eb; color: white; border: none; border-radius: 6px; padding: 10px; font-weight: 600; cursor: pointer; transition: background 0.2s;">
          Submit Answer for AI Grading
        </button>

        <div id="ai-feedback-container" style="display: none; margin-top: 20px;"></div>
      `;
    }

    // Submit Answer and Render Feedback
    async function submitWrittenAnswer(qIndex) {
      const currentQ = currentQuizQuestions[qIndex];
      const answerText = document.getElementById("student-written-answer").value.trim();
      const feedbackContainer = document.getElementById("ai-feedback-container");
      const submitBtn = document.getElementById("submit-written-btn");

      if (!answerText) {
        alert("Please write an answer before submitting.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Evaluating with AI Examiner...";
      
      feedbackContainer.style.display = "block";
      feedbackContainer.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 10px;">Analyzing answer against CIE Mark Scheme...</div>`;

      try {
        const payload = {
          action: "evaluateWrittenAnswer",
          questionPrompt: currentQ.question,
          caseStudy: currentQ.caseStudy || "",
          markScheme: currentQ.markScheme || "",
          studentAnswer: answerText,
          maxMarks: currentQ.maxMarks || 6
        };

        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        
        const awarded = result.marksAwarded ?? 0;
        const max = result.maxMarks ?? currentQ.maxMarks ?? 6;
        const percentage = Math.round((awarded / max) * 100);

        feedbackContainer.innerHTML = `
          <div style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 12px;">
              <span style="font-weight: bold; color: #38bdf8;">Cambridge AI Examiner Result</span>
              <span style="font-weight: bold; font-size: 1.1em; color: ${awarded > 0 ? '#4ade80' : '#f87171'};">
                Score: ${awarded} / ${max}
              </span>
            </div>

            ${result.breakdown ? `
              <div style="font-size: 0.85em; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; margin-bottom: 12px;">
                <div style="color: #cbd5e1; margin-bottom: 4px;"><strong>AO1 Knowledge:</strong> ${result.breakdown.knowledge || "N/A"}</div>
                <div style="color: #cbd5e1; margin-bottom: 4px;"><strong>AO2 Application:</strong> ${result.breakdown.application || "N/A"}</div>
                <div style="color: #cbd5e1;"><strong>AO3 Analysis:</strong> ${result.breakdown.analysis || "N/A"}</div>
              </div>
            ` : ''}

            <div style="margin-bottom: 12px;">
              <strong style="color: #facc15; font-size: 0.9em; display: block; margin-bottom: 4px;">💡 Examiner Feedback:</strong>
              <p style="font-size: 0.9em; color: #e2e8f0; margin: 0; line-height: 1.4;">${result.constructiveFeedback || "No detailed feedback provided."}</p>
            </div>

            ${result.modelAnswer ? `
              <div style="background: rgba(16, 185, 129, 0.1); border-left: 3px solid #10b981; padding: 10px; border-radius: 4px; margin-bottom: 16px;">
                <strong style="color: #34d399; font-size: 0.85em; display: block; margin-bottom: 4px;">🎯 Exemplar Model Answer:</strong>
                <p style="font-size: 0.85em; color: #cbd5e1; margin: 0; line-height: 1.4;">${result.modelAnswer}</p>
              </div>
            ` : ''}

            <button onclick="submitFinalScore(${awarded}, ${max})" style="width: 100%; background: #10b981; color: white; border: none; border-radius: 6px; padding: 10px; font-weight: 600; cursor: pointer; transition: background 0.2s;">
              Submit Final Quiz Score
            </button>
          </div>
        `;

        submitBtn.innerText = "Re-evaluate Answer";
        submitBtn.disabled = false;

      } catch (err) {
        feedbackContainer.innerHTML = `<div style="color: #f87171; font-size: 0.9em;">Evaluation error: ${err.message}. Please check your deployment.</div>`;
        submitBtn.innerText = "Submit Answer for AI Grading";
        submitBtn.disabled = false;
      }
    }

    async function submitFinalScore(awarded, max) {
      if (!currentUser) return;
      const percent = Math.round((awarded / max) * 100);

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "submitResult",
            email: currentUser.email,
            quizId: currentQuizId,
            score: percent,
            attemptNumber: 1,
            isFirstTry100: percent === 100
          })
        });

        alert("Quiz score recorded successfully!");
        closeQuizModal();
        loadLeaderboard();
      } catch (err) {
        alert("Failed to record score.");
      }
    }
  </script>
</body>
</html>
